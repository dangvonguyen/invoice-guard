openapi: 3.1.0
info:
  title: Invoice Guard API
  version: 0.1.0
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Authenticate a user and return an access token.
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/me:
    get:
      tags:
      - Users
      summary: Get User Me
      description: Get the current user's data.
      operationId: get_user_me_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
      security:
      - HTTPBearer: []
  /health/live:
    get:
      tags:
      - Health
      summary: Live
      description: Return a minimal response to show the service is up.
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Live Health Live Get
  /health/ready:
    get:
      tags:
      - Health
      summary: Ready
      description: 'Return a minimal response to show the service is ready.


        Verifies database connectivity before reporting readiness.'
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Health Ready Get
components:
  schemas:
    CurrentUserResponse:
      properties:
        id:
          type: string
          title: Id
        email:
          type: string
          title: Email
      type: object
      required:
      - id
      - email
      title: CurrentUserResponse
      description: Response for users getting their own user data.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      title: TokenResponse
      description: Response body for a successful login.
    UserLoginRequest:
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 3
          title: Email
        password:
          type: string
          maxLength: 256
          minLength: 1
          title: Password
      type: object
      required:
      - email
      - password
      title: UserLoginRequest
      description: Email/password login payload.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
servers:
- url: /api
