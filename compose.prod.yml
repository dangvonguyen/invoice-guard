# Production overlay. Combine with the shared base:
#
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# Services run their built `prod` image stages — no bind mounts, no reload, and a
# restart policy on the long-running processes. Object storage is a managed
# S3-compatible service: put the STORAGE_S3_* endpoint, region, bucket, and
# credentials in backend/.env (this overlay pins STORAGE_BACKEND=s3).
x-backend-prod: &backend-prod
  build:
    context: ./backend
    target: prod
  restart: unless-stopped
  environment:
    STORAGE_BACKEND: s3
    STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}

services:
  migrator:
    <<: *backend-prod
    restart: "no"

  api:
    <<: *backend-prod
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *backend-prod

  web:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
