name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Create environment files
        run: |
          cp ../.env.example ../.env
          cp .env.example .env

      - name: Run lint
        run: uv run ruff check . --output-format=github

      - name: Run format
        run: uv run ruff format --check .

      - name: Run typecheck
        run: uv run mypy app tests eval

      - name: Run tests
        run: uv run pytest

      - name: Check the golden set regenerates with no diff
        run: |
          uv run python -m eval.extraction.build
          uv run python -m eval.explanation.build
          git diff --exit-code eval

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run format check
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm exec tsc -b

      - name: Run build
        run: pnpm exec vite build

  docker-compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create environment files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Start application
        run: docker compose up -d --wait api web

      - name: Test backend
        run: curl http://localhost:8000/api/health/live

      - name: Test frontend
        run: curl http://localhost:5173

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application
        run: docker compose down --volumes --remove-orphans
