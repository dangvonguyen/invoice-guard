server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's largest bounded body.
    client_max_body_size 50m;

    # Reverse-proxy the API. Resolve the upstream through Docker's embedded DNS
    # at request time (via a variable) so nginx starts even when api is briefly
    # down. The backend mounts its routes under root_path /api, so $request_uri
    # forwards the prefix as-is rather than stripping it.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
