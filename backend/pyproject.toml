[project]
name = "backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
	"alembic>=1.18.5",
	"asyncpg>=0.31.0",
	"fastapi[standard]>=0.140.13",
	"openai>=3.0.0",
	"pwdlib[argon2]>=0.3.0",
	"pydantic>=2.13.4",
	"pydantic-settings>=2.14.2",
	"pyjwt>=2.13.0",
	"pypdf>=6.15.0",
	"redis>=8.1.0",
	"rq>=2.10.0",
	"sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
	"fpdf2>=2.8.8",
	"mypy>=2.3.0",
	"poethepoet>=0.48.0",
	"prek>=0.4.12",
	"pytest>=9.1.1",
	"pytest-asyncio>=1.4.0",
	"pytest-cov>=7.1.0",
	"ruff>=0.16.0",
	"testcontainers[postgres,redis]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_functions = ["test_*", "should_*"]
addopts = ["--import-mode=importlib"]
markers = [
	"unit: fast, no external deps",
	"integration: real DB, single adapter, no HTTP layer",
	"acceptance: real DB, real app, business-facing scenario",
]

[tool.poe.tasks]
# Setup PoeThePoet tasks
prek.help = "Run pre commit checks using prek"
prek.cmd = "prek run --all-files"
mypy.help = "Run mypy checks"
mypy.cmd = "mypy . --strict"
format.help = "Format code with Ruff"
format.cmd = "ruff format ."
ruff.help = "Run Ruff checks"
ruff.cmd = "ruff check --output-format=concise ."

# Testing tasks
test.help = "Run all tests using Pytest"
test.cmd = "pytest"
"test:u".help = "Run only Unit tests using Pytest"
"test:u".cmd = "pytest -m unit"
"test:i".help = "Run only Integration tests using Pytest"
"test:i".cmd = "pytest -m integration"
"test:a".help = "Run only Acceptance tests using Pytest"
"test:a".cmd = "pytest -m acceptance"
"test:skipped".help = "Show skipped tests without running all tests"
"test:skipped".cmd = "pytest --quiet --collect-only -m skip --no-cov"

[tool.mypy]
python_version = "3.13"
strict = true
no_implicit_optional = true
warn_unreachable = true


[tool.ruff]
line-length = 88
target-version = "py313"


[tool.ruff.lint]
select = [
	"F",     # pyflakes
	"E",     # pycodestyle errors
	"W",     # pycodestyle warnings
	"I",     # isort
	"B",     # flake8-bugbear
	"G",     # flake8-logging-format
	"C4",    # flake8-comprehensions
	"ARG",   # flake8-unused-arguments
	"PT",    # flake8-pytest-style
	"PTH",   # flake8-use-pathlib
	"RET",   # flake8-return
	"SIM",   # flake8-simplify
	"RUF",   # Ruff-specific
	"UP",    # pyupgrade
	"FAST",  # FastAPI
	"ASYNC", # flake8-async
]
ignore = [
	"E501",   # line-too-long
	"G004",   # log-exception-outside-except-handler
	"UP007",  # non-pep604-annotation-union
	"UP045",  # non-pep604-annotation-optional
	"ANN003", # missing-type-kwargs
	"ARG002", # unused-method-argument
	"RET504", # unnecessary-assign
	"RET505", # superfluous-else-return
	"RET506", # superfluous-else-raise
	"PTH123", # builtin-open
	"SIM105", # suppressible-exception
	"SIM108", # if-else-block-instead-of-if-exp
	"SIM117", # multiple-with-statements
	"RUF012", # mutable-class-default
	"C408",   # unnecessary-collection-call
	"PT018",  # pytest-composite-assertion
]
