title: Reimbursement request filed 41 days after the event, past the approval cutoff
rule: EXPENSE_WITHIN_SUBMISSION_WINDOW
dimensions:
  - threshold-in-prose
  - conditional-limit
  - distractor-heavy

evidence:
  invoice_age_days: 41
  max_expense_age_days: 30

context:
  - "1. Travel#0"
  - "2. Lodging#0"
  - "6. Expense Reimbursement Timelines#0"
  - "3. Meals#0"
  - "5. Non-Reimbursable Expenses#0"

grading:
  citations:
    ideal:
      - "6. Expense Reimbursement Timelines#0"
    min_recall: 1.0
    max_spurious: 0
  checks:
    - id: names_window
      kind: must_contain
      pattern: '30\s*days'
  rubric:
    - id: answers_this_flag
      severity: must
      statement: >-
        Attributes the flag to the request being submitted after the 30-day
        submission window.
    - id: names_approval_path
      severity: must
      statement: >-
        States that a submission received after 30 days requires approval by the
        Executive Director.
    - id: grounded
      severity: must
      statement: >-
        Every factual claim is supported by the provided excerpts; nothing is
        invented.
    - id: neutral_tone
      severity: should
      statement: Tone is neutral and professional.

notes: >-
  The 30-day limit lives only in running prose ("submitted within 15 days and no
  later than 30 days upon conclusion of the event") and is conditional rather
  than absolute: a request past 30 days is not refused outright but "shall
  require approval by the Executive Director", with extensions gated on mitigating
  circumstances. Four dollar-limit / eligibility chunks (air travel, lodging,
  meals, non-reimbursable) fill the context as distractors.
