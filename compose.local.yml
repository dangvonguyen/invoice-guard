# Local development overlay. Combine with the shared base:
#
#   docker compose -f compose.yml -f compose.local.yml up
#
# Source changes are pushed into the running containers by `docker compose
# watch`, every service port is published on localhost, and object storage
# is served by a local MinIO container instead of a managed S3 bucket.
x-backend-dev: &backend-dev
  build:
    context: ./backend
    target: dev
  develop:
    watch:
      - path: ./backend
        action: sync
        target: /app
        ignore:
          - .venv
      - path: ./backend/pyproject.toml
        action: rebuild

x-minio-env: &minio-env
  STORAGE_BACKEND: s3
  STORAGE_S3_ENDPOINT_URL: http://minio:9000
  STORAGE_S3_REGION: us-east-1
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
  STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo 'waiting for minio...'; sleep 1;
        done;
        mc mb --ignore-existing "local/$${STORAGE_S3_BUCKET}";

  migrator:
    <<: *backend-dev
    environment: *minio-env

  api:
    <<: *backend-dev
    environment: *minio-env
    ports:
      - "8000:8000"
    depends_on:
      createbucket:
        condition: service_completed_successfully

  worker:
    <<: *backend-dev
    environment: *minio-env
    depends_on:
      createbucket:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: http://api:8000
    ports:
      - "5173:5173"
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app
          ignore:
            - node_modules/
        - path: ./frontend/package.json
          action: rebuild
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minio_data:
